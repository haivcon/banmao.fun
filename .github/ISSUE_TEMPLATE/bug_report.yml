name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not disclose vulnerabilities or secrets here. Follow SECURITY.md."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps, route, wallet state, chain ID, and transaction hash when relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, network, and wallet. Never include keys or seed phrases.
