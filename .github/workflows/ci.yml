name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify generated BanmaoBox release files are current
        shell: bash
        run: |
          npm run generate:banmaobox
          npm run generate:banmaobox:release
          git diff --exit-code -- app/defi/box/generated/abis.ts deployments/banmaobox-release-artifacts.json deployments/banmaobox-releases lib/banmaobox/verification-release.json
          release_hash="$(node -p 'require("./deployments/banmaobox-release-artifacts.json").compilerInputHash.slice(2)')"
          test -f "deployments/banmaobox-releases/${release_hash}.json"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand --passWithNoTests
      - run: npm audit --omit=dev --audit-level=critical

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml
