name: CI

on:
  pull_request:
  push:
    branches: [main, banmaoking]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Repository hygiene (tracked files only)
        shell: bash
        run: |
          forbidden=$(git ls-files | grep -Ei '^(__tests__|tests|test|test-results|tools|scripts|\.tmp|coverage|playwright-report)/|\.(test|spec)\.|\.(log|err|out|exit)$' || true)
          if [ -n "$forbidden" ]; then
            printf 'Local-only files must not be tracked:\n%s\n' "$forbidden"
            exit 1
          fi
      # Generated-artifact and Jest checks require the private local test workspace.
      # Run npm run check locally before publishing; CI does not claim test coverage.
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production dependency audit (critical)
        run: npm audit --omit=dev --audit-level=critical

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Scan full Git history
        run: gitleaks git . --config .github/gitleaks.toml --redact --log-opts=--all
