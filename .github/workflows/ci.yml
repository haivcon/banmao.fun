name: CI

on:
  pull_request:
  push:
    branches: [main, banmaoking]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --force
      - name: Repository hygiene (tracked files only)
        shell: bash
        run: |
          forbidden=$(git ls-files | grep -Ei '^(__tests__|tests|test|test-results|tools|scripts|\.tmp|coverage|playwright-report)/|\.(test|spec)\.|\.(log|err|out|exit)$' || true)
          if [ -n "$forbidden" ]; then
            printf 'Local-only files must not be tracked:\n%s\n' "$forbidden"
            exit 1
          fi
      # Generated-artifact and Jest checks require the private local test workspace.
      # Run npm run check locally before publishing; CI does not claim test coverage.
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production dependency audit (critical)
        run: npm audit --omit=dev --audit-level=critical 2>&1 | grep -v 'node_modules/ganache/' || true
        # ganache is a devDependency but npm audit still scans its bundled
        # sub-dependencies; filter those lines so only real prod criticals fail.
        # The actual exit-code check is below.
      - name: Fail on real prod criticals
        run: |
          # Re-run audit, exclude ganache bundled deps, fail only if real criticals remain
          output=$(npm audit --omit=dev --audit-level=critical --json 2>/dev/null || true)
          real=$(echo "$output" | node -e "
            const j=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const v=j.vulnerabilities||{};
            const real=Object.entries(v).filter(([,d])=>d.severity==='critical'&&!(d.nodes||[]).every(n=>n.startsWith('node_modules/ganache/')));
            if(real.length){console.log(real.map(([n])=>n).join(', '));process.exit(1);}
          " 2>&1) || { echo "::error::Critical production vulnerabilities: $real"; exit 1; }
          echo "No real production critical vulnerabilities found."

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Scan full Git history
        run: gitleaks git . --config .github/gitleaks.toml --redact --log-opts=--all
