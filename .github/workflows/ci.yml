name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run generate:banmaobox
      - name: Ensure generated ABI is current
        run: git diff --exit-code -- app/defi/box/generated/abis.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand --passWithNoTests
      - run: npm audit --omit=dev --audit-level=critical

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
