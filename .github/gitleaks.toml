[extend]
useDefault = true

[allowlist]
paths = [
  '''__tests__/''',
  # Deployment manifests contain only public addresses, transaction hashes, and runtime hashes.
  '''^deployments/banmaobox-(?:xlayer-(?:mainnet|testnet)|mainnet-history/.*)[.]json$''',
]
regexes = [
  # Public EVM address fallback in the audited testnet deployment script (40 hex chars, not a key).
  '''^0x[a-fA-F0-9]{40}$''',
]
commits = [
  # Public X Layer token address and deployment transaction hash
  "2e9dbede1f23fd24d7824ae05c02074c33d0f3eb",
  # Public on-chain BANMAO token address used in test fixtures (not a secret)
  "e5a83413d1d166d77b9f6e11bde3544f9523f81c",
]
